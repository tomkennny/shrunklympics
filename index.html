<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shrunklympics</title>
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-title" content="Shrunklympics">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke-width='5'%3E%3Ccircle cx='14' cy='26' r='10' stroke='%230a85d8'/%3E%3Ccircle cx='32' cy='26' r='10' stroke='%23c3ced8'/%3E%3Ccircle cx='50' cy='26' r='10' stroke='%23ee334e'/%3E%3Ccircle cx='23' cy='38' r='10' stroke='%23fcb131'/%3E%3Ccircle cx='41' cy='38' r='10' stroke='%2300a651'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Titan+One&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one centred column on a night-sky field; rotating rings and an event illustration sit behind translucent panels (after the WC26 site). */
:root {
  color-scheme: dark;
  --bg: #070b12;
  --panel: rgba(15, 24, 36, 0.8);
  --panel-2: rgba(21, 34, 47, 0.86);
  --line: #1f3142;
  --line-soft: rgba(31, 49, 66, 0.6);
  --text: #eef4f9;
  --muted: #7e93a6;
  --pitch: #2fbf71;
  --pitch-tint: rgba(47, 191, 113, 0.12);
  --live: #ff4655;
  --live-tint: rgba(255, 70, 85, 0.08);
  --gold: #e8b84b;
  --gold-tint: rgba(232, 184, 75, 0.09);
  --silver: #c3ced8;
  --bronze: #d38c5c;
  --art: #5fd39a;
  --art-2: #e8b84b;
  --card-paper: #f3efe2;
  --card-ink: #183a28;
  --card-head: #1f5c3a;
  --card-rule: #cfc6a8;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  --brand: "Titan One", "Arial Rounded MT Bold", "Barlow Condensed", sans-serif;
  --c-beef: #ef6b57;
  --c-bubbles: #5cc6ec;
  --c-gloves: #b28cf2;
  --c-swoothy: #f27ab6;
  --c-veteran: #a9bccb;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  min-height: 100vh;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#rings {
  position: fixed; z-index: 0; pointer-events: none;
  top: 70px; right: max(-30px, calc(50% - 700px));
  width: min(46vw, 470px); height: min(30vw, 300px);
}
#art {
  position: fixed; z-index: 0; pointer-events: none;
  left: max(-40px, calc(50% - 720px)); bottom: -10px;
  width: min(52vw, 540px); opacity: .28; color: var(--art);
}
#art svg { width: 100%; height: auto; display: block; overflow: visible; }
#art img.lineimg { display: block; width: 72%; max-height: 62vh; object-fit: contain; object-position: left bottom; height: auto; margin-left: 8%; margin-bottom: 12px; }
.wrap {
  position: relative; z-index: 1;
  max-width: 860px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top { border-bottom: 1px solid var(--line); position: relative; z-index: 1; }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; flex-wrap: wrap; }
h1 { margin: 0; line-height: 0; }
h1 svg { height: clamp(36px, 8vw, 54px); width: auto; display: block; }
.sync { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.on .dot { background: var(--pitch); box-shadow: 0 0 0 3px rgba(47,191,113,.18); }
.sync.err .dot { background: var(--live); }
.badge {
  font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 3px 8px; color: var(--gold);
}

nav.tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-block: 20px 8px; }
.tab {
  font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 13px; cursor: pointer; text-decoration: none; transition: color .15s, border-color .15s, background .15s;
}
.tab:hover { color: var(--text); }
.tab[aria-current="page"] { color: var(--text); border-color: var(--pitch); background: var(--pitch-tint); }
.tab:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--pitch); outline-offset: 2px; }

main { display: grid; gap: 18px; padding-block: 12px 40px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.eyebrow {
  font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px;
}
h2 { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .03em; text-transform: uppercase; margin: 0; line-height: 1.05; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* tables */
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th {
  font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
td { padding: 10px 8px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th.num, td.num { text-align: right; }
td.place { font-family: var(--display); font-weight: 700; font-size: 17px; width: 38px; color: var(--muted); }
tr.p1 td.place { color: var(--gold); }
tr.p2 td.place { color: var(--silver); }
tr.p3 td.place { color: var(--bronze); }
tr.lead { background: var(--gold-tint); }
tr.lead .who-name { color: var(--gold); }
td.pts { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--pitch); }
td.ev.none { color: var(--muted); }
.who { display: inline-flex; align-items: center; gap: 10px; }
.mono {
  width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .04em; color: #0b1018;
}
.who-name { font-weight: 600; }
.sub { color: var(--muted); font-size: 12.5px; }

/* overall summary */
.hero { display: grid; gap: 14px; }
.hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.progress { display: flex; gap: 4px; align-items: center; }
.progress span { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.progress span.done { background: var(--pitch); }
.progress span.live { background: var(--gold); }

.events { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ecard {
  display: grid; gap: 6px; align-content: start; text-align: left; cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; color: var(--text); font: inherit;
}
.ecard:hover { border-color: #2b4458; }
.ecard .ename { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .03em; text-transform: uppercase; line-height: 1.1; }
.ecard .ewin { font-size: 13px; color: var(--muted); }
.ecard .ewin b { color: var(--gold); font-weight: 600; }

.pill {
  justify-self: start; display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--display); font-weight: 600; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.live { color: var(--gold); border-color: rgba(232,184,75,.4); }
.pill.final { color: var(--pitch); border-color: rgba(47,191,113,.45); }

.scale { display: flex; flex-wrap: wrap; gap: 6px; }
.scale span { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; font-variant-numeric: tabular-nums; }
.scale span b { color: var(--text); font-weight: 600; }

details.rules { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
details.rules summary {
  list-style: none; cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;
  font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--pitch);
}
details.rules summary::-webkit-details-marker { display: none; }
details.rules summary::after { content: "▸ show"; font-family: var(--body); font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--muted); }
details.rules[open] summary::after { content: "▾ hide"; }
details.rules .body { padding: 0 14px 14px; display: grid; gap: 10px; color: var(--muted); font-size: 14px; max-width: 68ch; }
details.rules .body b { color: var(--text); font-weight: 600; }

.ehead { display: grid; gap: 10px; }
.ehead .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.rulelist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-width: 70ch; }
.rulelist li { position: relative; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); font-size: 14.5px; }
.rulelist li::before { content: ""; position: absolute; left: 14px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.rulelist li.hot { border-color: rgba(255,70,85,.45); background: var(--live-tint); color: #ffd0d4; font-weight: 600; }
.rulelist li.hot::before { background: var(--live); }
.ehead .edesc { color: var(--text); opacity: .85; font-size: 15px; max-width: 62ch; margin-top: -4px; }

/* forms */
.formgrid { display: grid; gap: 10px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 10px; align-items: center; }
label { font-size: 14px; }
input[type="text"], input[type="email"], input[type="password"], select {
  font: inherit; color: var(--text); background: #0d1520; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
}
select { cursor: pointer; }
input::placeholder { color: #4e6274; }
button.btn {
  font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
  padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); cursor: pointer;
}
button.btn.primary { border-color: var(--pitch); color: var(--pitch); background: var(--pitch-tint); }
button.btn.danger { color: var(--live); border-color: rgba(255,70,85,.35); }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
.cfg { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; }
.cfg label { display: grid; gap: 4px; color: var(--muted); font-size: 12.5px; }

/* coffee ballot */
.judgebar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.judgebar select { width: auto; min-width: 180px; }
.judges { display: flex; gap: 6px; flex-wrap: wrap; }
.jchip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 4px; color: var(--muted); }
.jchip .mono { width: 20px; height: 20px; font-size: 9px; }
.jchip.done { color: var(--text); border-color: rgba(47,191,113,.45); }
.jchip.done::after { content: "✓"; color: var(--pitch); font-weight: 700; }
.ballot { display: grid; gap: 14px; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.slot {
  display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 10px;
  border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; min-height: 48px;
}
.slot.filled { border-style: solid; background: var(--panel-2); }
.slot-place { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--muted); }
.slot:nth-child(1) .slot-place { color: var(--gold); }
.slot:nth-child(2) .slot-place { color: var(--silver); }
.slot:nth-child(3) .slot-place { color: var(--bronze); }
.pool { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pick {
  display: flex; align-items: center; gap: 8px; font: inherit; color: var(--text); text-align: left;
  background: #0d1520; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; cursor: pointer; min-width: 0;
}
.pick span.nm { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .pick-place { font-family: var(--display); font-weight: 700; color: var(--pitch); font-size: 15px; }
.pick[aria-pressed="true"] { border-color: var(--pitch); background: var(--pitch-tint); }
.pick:disabled { opacity: .5; cursor: not-allowed; }

.notice { border: 1px dashed rgba(255,70,85,.45); background: var(--live-tint); color: #f3a3aa; border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.notice.calm { border-color: var(--line); background: var(--panel-2); color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }

/* golf scorecard */
.scorecard {
  background: var(--card-paper); color: var(--card-ink); border-radius: 10px; padding: 14px 12px 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35); display: grid; gap: 12px;
}
.sc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 0 4px; }
.sc-title { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; color: var(--card-head); }
.sc-status { font-size: 13px; color: #5c6b55; }
.sc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.sc { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
.sc th, .sc td { border-bottom: 1px solid var(--card-rule); border-right: 1px solid var(--card-rule); padding: 0; text-align: center; color: var(--card-ink); white-space: nowrap; }
.sc thead th { background: var(--card-head); color: #f3efe2; font-size: 12px; padding: 6px 0; border-color: #2b6e48; letter-spacing: .06em; }
.sc .nm { position: sticky; left: 0; z-index: 1; background: var(--card-paper); text-align: left; padding: 0 10px; min-width: 112px; font-weight: 600; font-size: 14px; }
.sc thead .nm { background: var(--card-head); color: #f3efe2; }
.sc tr.par td { background: #e7e1cc; font-size: 13px; }
.sc tr.par .nm { background: #e7e1cc; font-family: var(--display); letter-spacing: .1em; text-transform: uppercase; }
.sc td.sum { font-family: var(--display); font-weight: 700; font-size: 16px; min-width: 42px; background: #ebe5d0; }
.sc thead th.sumh { background: #174a2e; }
.sc input {
  width: 34px; height: 36px; border: 0; background: transparent; text-align: center; font: 600 16px/1 var(--body);
  color: var(--card-ink); padding: 0; border-radius: 0;
}
.sc input:focus { background: #fffbe9; outline: 2px solid var(--card-head); outline-offset: -2px; }
.sc input.bad { background: #f7d6d3; color: #8a1c14; }
.sc tr.par input { font-size: 13px; height: 30px; color: #5c6b55; }
.sc .nm .who { gap: 8px; }
.sc .nm .mono { width: 22px; height: 22px; font-size: 9.5px; }
.sc-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; padding: 0 4px; }
.sc-foot .btn { color: var(--card-ink); background: transparent; border-color: var(--card-rule); }
.sc-foot .btn.danger { color: #a3241a; border-color: #e0b3ad; }
.sc td.ro { height: 36px; min-width: 34px; font: 600 15px/1 var(--body); }
.sc tr.par td.ro { height: 30px; font-size: 13px; color: #5c6b55; }
.sc td.ro span { display: inline-grid; place-items: center; width: 24px; height: 24px; }
.sc td.ro.under span { border: 1.5px solid var(--card-head); border-radius: 50%; color: var(--card-head); }
.sc td.ro.over span { border: 1.5px solid #9a8f74; border-radius: 3px; }
.sc.kick th.spot { font-size: 11px; line-height: 1.15; padding: 5px 2px; min-width: 52px; }
.sc.kick td.kc { padding: 4px 5px; }
.kseg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.kb {
  font: 700 12px/1 var(--display); letter-spacing: .04em; padding: 7px 0; min-width: 18px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--card-rule); background: transparent; color: #5c6b55;
}
.kb[aria-pressed="true"].k6 { background: var(--card-head); border-color: var(--card-head); color: #f3efe2; }
.kb[aria-pressed="true"].k1 { background: #c58f2a; border-color: #c58f2a; color: #fff8e6; }
.kb[aria-pressed="true"].k0 { background: #8b8a80; border-color: #8b8a80; color: #fff; }
.kb:focus-visible { outline: 2px solid var(--card-head); outline-offset: 1px; }
.sc td.kv { font: 700 16px/1 var(--display); height: 40px; min-width: 52px; }
.sc td.kv small { font: 500 10px/1 var(--body); margin-left: 2px; color: #7a8571; }
.sc td.kv.k6 { color: var(--card-head); }
.sc td.kv.k1 { color: #a8741a; }
.sc td.kv.k0 { color: #8b8a80; }
.tbwrap { display: grid; gap: 8px; padding: 0 4px; }
.tb { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; border: 1px dashed #c58f2a; background: #fbf3dc; border-radius: 8px; padding: 10px 12px; color: var(--card-ink); font-size: 14px; }
.tb.done { border-style: solid; border-color: var(--card-rule); background: #ebe5d0; }
.tb .btn { color: var(--card-ink); background: transparent; border-color: var(--card-rule); padding: 6px 12px; }
.tbpicks { display: flex; flex-wrap: wrap; gap: 6px; }
.tbpick { display: inline-flex; align-items: center; gap: 6px; font: 600 14px var(--body); color: var(--card-ink); background: #fffdf5; border: 1px solid var(--card-rule); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.tbpick[aria-pressed="true"] { border-color: var(--card-head); background: #e3efe6; }
.tbpick b { font-family: var(--display); color: var(--card-head); }
.tbpick .mono { width: 20px; height: 20px; font-size: 9px; }
.tbbox { display: grid; gap: 10px; }
.tbb { display: grid; gap: 8px; border: 1px dashed rgba(232,184,75,.5); background: var(--gold-tint); border-radius: 10px; padding: 12px; }
.tbb-head { font-size: 14px; }
.tbb-head b { color: var(--gold); }

.linkbtn { font: inherit; color: var(--pitch); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.gate { max-width: 440px; margin: 40px auto 0; display: grid; gap: 14px; justify-items: center; text-align: center; padding-block: 28px; }
.gate h2 { font-size: 26px; }
.gate #gateErr { width: 100%; text-align: left; }
.gbtn {
  display: inline-flex; align-items: center; gap: 10px; font: 600 15px var(--body); color: #1f1f1f; background: #fff;
  border: 1px solid #dadce0; border-radius: 999px; padding: 10px 20px; cursor: pointer;
}
.gbtn:hover { background: #f4f6f8; }
.gbtn:focus-visible { outline: 2px solid var(--pitch); outline-offset: 2px; }
#setupNote:not(:empty) { margin-top: 16px; }
.setup { display: grid; gap: 8px; border: 1px dashed rgba(232,184,75,.55); background: var(--gold-tint); border-radius: 12px; padding: 14px 16px; font-size: 14px; }
.setup code { font: 600 13px/1.4 ui-monospace, Menlo, monospace; background: #0d1520; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; word-break: break-all; }
.frow.wide { grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); }
#acctWrap:not(:empty) { padding-bottom: 40px; }
.me-tag { font-size: 14px; }
.me-tag b { color: var(--gold); }
footer { position: relative; z-index: 1; text-align: center; color: var(--muted); font-size: 13px; padding-block: 8px 32px; }

#toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  background: var(--panel-2); border: 1px solid var(--pitch); color: var(--text); padding: 10px 16px; border-radius: 10px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; max-width: calc(100% - 32px);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { border-color: var(--live); }

.spin { transform-box: view-box; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.steam { animation: steam 4s ease-in-out infinite; }
@keyframes steam { 0%,100% { opacity: .3; transform: translateY(0); } 50% { opacity: .8; transform: translateY(-8px); } }

@media (max-width: 560px) {
  .frow { grid-template-columns: minmax(0, 1fr) 110px; }
  .cfg { grid-template-columns: 1fr; }
  td { padding: 9px 6px; }
  th { padding: 6px; }
  .mono { width: 24px; height: 24px; font-size: 10.5px; }
  .who { gap: 8px; }
  .tab { font-size: 14px; padding: 7px 10px; }
  #rings { top: 190px; right: -40px; width: 78vw; height: 50vw; opacity: .55; }
  #art { left: 4vw; width: 92vw; opacity: .17; }
  .pool { grid-template-columns: 1fr; }
  .sc .nm { min-width: 96px; padding: 0 6px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .spin, .steam { animation: none; }
}
</style>
</head>

<script>
(() => {
  // =====================================================================
  //  SETTINGS YOU CAN EDIT: competitors, event names, descriptions, rules.
  //  Keep each "id" the same once scores exist, or saved scores won't match.
  // =====================================================================
  const COMPETITORS = [
    { id: "beef", name: "Beef", mono: "BE", color: "var(--c-beef)" },
    { id: "bubbles", name: "Bubbles", mono: "BU", color: "var(--c-bubbles)" },
    { id: "gloves", name: "Gloves", mono: "GL", color: "var(--c-gloves)" },

    { id: "veteran", name: "The Veteran", mono: "TV", color: "var(--c-veteran)" },
  ];
  const C = Object.fromEntries(COMPETITORS.map(c => [c.id, c]));
  const STD = [5, 4, 3, 2, 1];
  const GOLF = [10, 8, 6, 4, 1];
  const HOLES = 18;
  const EVENTS = [
    { id: "coffee", name: "Barista Battle", short: "Barista Battle", code: "Coffee", table: STD, voted: true,
      blurb: "Every competitor ranks the other four lattes. Best average ranking wins.", desc: "Who is Shrunk's best latte artist?" },
    { id: "lego", name: "Lego Masters", short: "Lego Masters", code: "Lego", table: STD, mode: "time", unit: "time",
      blurb: "Fastest complete build wins.", desc: "A lego build race for the ages.",
      rules: [
        { t: "Lego boxes mustn't be opened until the stopwatch has started." },
        { t: "When you have finished your build, yell out your name. The stopwatch will pause and all remaining competitors must stop their builds until the completed build is confirmed & the stopwatch is restarted." },
        { t: "Rinse & repeat until all competitors have finished." },
      ] },
    { id: "kart", name: "Beer-io Kart", short: "Beer-io Kart", code: "Mario", table: STD, mode: "high", unit: "GP points",
      blurb: "Most Grand Prix points wins.", desc: "A Mario Kart Grand Prix, with the final race being played to Beer-io Kart rules.",
      rulesTitle: "Final race · Beer-io Kart rules",
      rules: [
        { t: "All competitors must start with a full drink." },
        { t: "The drink must be finished before crossing the finish line at the end of the race. If it is not finished, you will be disqualified and required to do a shot chosen by the winner." },
        { t: "DO NOT DRINK AND DRIVE. You can only drink when your kart is completely stopped.", hot: true },
        { t: "Getting hit by an item (shell, banana etc.) requires you to take a big gulp of your drink." },
        { t: "Last place finisher is required to do a shot chosen by the winner." },
      ] },
    { id: "afl", name: "Shrunk Sharpshooters", short: "Goalkicking", code: "AFL", table: STD, kicks: true,
      blurb: "Goal 6, behind 1, miss 0. Highest total wins; ties go to a head-to-head shoot-out.", desc: "An around-the-world AFL goal kicking competition, one shot from each of the five spots." },
    { id: "golf", name: "The Albert Park Open", short: "Mini Golf", code: "GOLF", table: GOLF, card: true,
      blurb: "18 holes. Fewest total strokes wins; ties go to a putt-off.", desc: "The Shrunklympics finale. With double points on offer, who can hold their nerve?" },
  ];
  const E = Object.fromEntries(EVENTS.map(e => [e.id, e]));
  const MODES = {
    high: { label: "Highest score wins", better: "high" },
    low: { label: "Lowest score wins", better: "low" },
    time: { label: "Fastest time wins (m:ss)", better: "low" },
    place: { label: "Enter finishing place (1–5)", better: "low" },
  };
  const ORD = ["1st", "2nd", "3rd", "4th", "5th"];
  const SPOTS = [
    { label: "Left pocket", l1: "Left", l2: "pocket" },
    { label: "Left 45°", l1: "Left", l2: "45°" },
    { label: "Straight in front", l1: "Straight", l2: "in front" },
    { label: "Right 45°", l1: "Right", l2: "45°" },
    { label: "Right pocket", l1: "Right", l2: "pocket" },
  ];
  const KICK = [[6, "Goal", "G"], [1, "Behind", "B"], [0, "Miss", "M"]];

  // ---------- state ----------
  const S = {
    db: null, uid: null, email: null, organiser: false, canWrite: null,
    players: {},           // competitor id -> linked @shrunk.ai email (from the database)
    meCid: null,           // which competitor the signed-in person is
    acctDraft: null, unsubs: [],
    results: {}, votes: {}, tbvotes: {},
    tbBallot: {},          // coffee tie-break ballots in progress, keyed by tie group
    coffeeTbDraft: {},     // organiser's manual tie-break order in progress
    view: "overall",
    adminDraft: {},
    ballot: { judge: null, order: [], dirty: false },
    golf: null,            // scorecard draft {par:[], holes:{cid:[]}, dirty, rev}
    kick: null,            // kick card draft {kicks:{cid:[]}, dirty, rev}
    tbDraft: {},           // tie-break picks in progress, keyed by tied group
    readOnly: false,
  };

  // ---------- helpers ----------
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const fmtPts = p => p == null ? "–" : (Math.abs(p - Math.round(p)) < 1e-9 ? String(Math.round(p)) : p.toFixed(1));
  const sum = a => a.reduce((x, y) => x + y, 0);
  function parseTime(str) {
    const s = String(str).trim(); if (!s) return null;
    if (s.includes(":")) {
      const parts = s.split(":"); if (parts.length > 3) return null;
      let total = 0;
      for (const p of parts) { const n = Number(p); if (!isFinite(n) || n < 0 || p.trim() === "") return null; total = total * 60 + n; }
      return total;
    }
    const n = Number(s); return isFinite(n) && n >= 0 ? n : null;
  }
  function fmtTime(sec) {
    if (sec == null) return "–";
    const m = Math.floor(sec / 60), r = sec - m * 60;
    const rs = Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)).padStart(2, "0") : r.toFixed(1).padStart(4, "0");
    return m + ":" + rs;
  }
  function parseScore(mode, str) {
    if (str == null || String(str).trim() === "") return null;
    if (mode === "time") return parseTime(str);
    const n = Number(String(str).trim()); return isFinite(n) ? n : null;
  }
  function fmtScore(mode, v) {
    if (v == null) return "–";
    if (mode === "time") return fmtTime(v);
    if (mode === "place") return ORD[Math.round(v) - 1] || String(v);
    return Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(2).replace(/0$/, "");
  }
  const fmtToPar = n => n == null ? "" : n === 0 ? "E" : (n > 0 ? "+" + n : String(n));
  function monoHTML(c) { return `<span class="mono" style="background:${c.color}" aria-hidden="true">${c.mono}</span>`; }
  function whoHTML(c) { return `<span class="who">${monoHTML(c)}<span class="who-name">${esc(c.name)}</span></span>`; }
  function placeLabel(place, tied) { return place == null ? "–" : (tied ? "=" : "") + place; }

  // Rank values; ties share the average of the points for the places they cover.
  // tb (optional): cid -> array of counts, higher is better, used to break ties.
  // fillNulls: competitors with no value tie for the remaining places.
  function rankAndScore(vals, better, table, fillNulls, tb) {
    const cmpTb = (a, b) => { if (!tb) return 0; const A = tb[a.cid], B = tb[b.cid]; for (let i = 0; i < A.length; i++) if (A[i] !== B[i]) return B[i] - A[i]; return 0; };
    const have = COMPETITORS.filter(c => vals[c.id] != null).map(c => ({ cid: c.id, val: vals[c.id] }));
    const none = COMPETITORS.filter(c => vals[c.id] == null).map(c => ({ cid: c.id, val: null }));
    have.sort((a, b) => (better === "high" ? b.val - a.val : a.val - b.val) || cmpTb(a, b));
    const same = (a, b) => Math.abs(a.val - b.val) < 1e-9 && cmpTb(a, b) === 0;
    const out = [];
    let i = 0;
    while (i < have.length) {
      let j = i;
      while (j + 1 < have.length && same(have[j + 1], have[i])) j++;
      const slice = table.slice(i, j + 1); const pts = sum(slice) / slice.length;
      for (let k = i; k <= j; k++) out.push({ ...have[k], place: i + 1, tied: j > i, pts });
      i = j + 1;
    }
    if (none.length) {
      if (fillNulls) {
        const start = have.length; const slice = table.slice(start); const pts = sum(slice) / slice.length;
        none.forEach(n => out.push({ ...n, place: start + 1, tied: none.length > 1, pts }));
      } else none.forEach(n => out.push({ ...n, place: null, tied: false, pts: null }));
    }
    return out;
  }

  // ---------- derived standings ----------
  function eventConfig(ev) {
    const r = S.results[ev.id] || {};
    return { mode: r.mode || ev.mode, unit: r.unit != null ? r.unit : ev.unit };
  }
  function coffeeData() {
    const cdoc = S.results.coffee || {};
    const closed = !!cdoc.closed;
    const judges = COMPETITORS.filter(j => { const v = S.votes[j.id]; return v && Array.isArray(v.ranking) && v.ranking.length > 0; }).map(j => j.id);
    const avg = {}, count = {}, places = {};
    COMPETITORS.forEach(c => {
      const got = [];
      judges.forEach(j => { if (j === c.id) return; const i = S.votes[j].ranking.indexOf(c.id); if (i >= 0) got.push(i + 1); });
      avg[c.id] = got.length ? sum(got) / got.length : null;
      count[c.id] = got.length;
      places[c.id] = [1, 2, 3, 4].map(p => got.filter(x => x === p).length);
    });
    const done = judges.length > 0 && (closed || judges.length === COMPETITORS.length);
    // Ties on average rank go to a re-vote by everyone not in the tie.
    const groups = [];
    if (done) {
      const ids = COMPETITORS.map(c => c.id).filter(id => avg[id] != null).sort((a, b) => avg[a] - avg[b]);
      let i = 0;
      while (i < ids.length) { let j = i; while (j + 1 < ids.length && Math.abs(avg[ids[j + 1]] - avg[ids[i]]) < 1e-9) j++; if (j > i) groups.push(ids.slice(i, j + 1)); i = j + 1; }
    }
    const manual = (cdoc.tbOrder && typeof cdoc.tbOrder === "object") ? cdoc.tbOrder : {};
    const tbMap = {}; COMPETITORS.forEach(c => tbMap[c.id] = [0]);
    const resolved = {};
    const info = groups.map(g => {
      const key = g.slice().sort().join("+");
      const voters = COMPETITORS.map(c => c.id).filter(id => !g.includes(id));
      const valid = r => Array.isArray(r) && r.length === g.length && g.every(x => r.includes(x));
      const voted = voters.filter(v => valid(S.tbvotes[key + "~" + v]?.ranking));
      let order = null, source = null, stillTied = false;
      if (valid(manual[key])) { order = manual[key].slice(); source = "manual"; }
      else if (voters.length && voted.length === voters.length) {
        const sc = {}; g.forEach(id => sc[id] = sum(voted.map(v => S.tbvotes[key + "~" + v].ranking.indexOf(id) + 1)) / voted.length);
        const sorted = g.slice().sort((a, b) => sc[a] - sc[b]);
        if (sorted.every((id, k) => k === 0 || Math.abs(sc[id] - sc[sorted[k - 1]]) > 1e-9)) { order = sorted; source = "vote"; } else stillTied = true;
      }
      if (order) order.forEach((id, k) => { tbMap[id] = [-k]; resolved[id] = { i: k, n: g.length }; });
      return { g, key, avg: avg[g[0]], voters, voted, order, source, stillTied };
    });
    return { closed, judges, avg, count, places, done, groups: info, tbMap, resolved };
  }
  function golfData() {
    const g = S.results.golf || {};
    const holes = g.holes || {}; const par = Array.isArray(g.par) ? g.par : [];
    const parAll = par.length === HOLES && par.every(n => typeof n === "number");
    const per = {};
    COMPETITORS.forEach(c => {
      const arr = Array.isArray(holes[c.id]) ? holes[c.id] : [];
      const played = []; for (let h = 0; h < HOLES; h++) if (typeof arr[h] === "number") played.push(h);
      const total = sum(played.map(h => arr[h]));
      per[c.id] = { thru: played.length, total: played.length ? total : null, toPar: parAll && played.length ? total - sum(played.map(h => par[h])) : null };
    });
    const complete = COMPETITORS.every(c => per[c.id].thru === HOLES);
    const tbStore = (g.tb && typeof g.tb === "object") ? g.tb : {};
    const groups = [];
    if (complete) {
      const byTotal = {};
      COMPETITORS.forEach(c => { (byTotal[per[c.id].total] = byTotal[per[c.id].total] || []).push(c.id); });
      Object.keys(byTotal).map(Number).sort((a, b) => a - b).forEach(t => { if (byTotal[t].length > 1) groups.push(byTotal[t]); });
    }
    const tb = {}; COMPETITORS.forEach(c => tb[c.id] = [0]);
    const unresolved = [], resolved = {};
    groups.forEach(gr => {
      const order = tbStore[tieKey(gr)];
      if (Array.isArray(order) && order.length === gr.length && gr.every(x => order.includes(x))) order.forEach((cid, i) => { tb[cid] = [-i]; resolved[cid] = { i, n: gr.length }; });
      else unresolved.push(gr);
    });
    return { per, parAll, par, complete, groups, unresolved, resolved, tb, tbStore };
  }
  const tieKey = g => g.slice().sort().join("|");
  function kickData() {
    const r = S.results.afl || {}; const k = r.kicks || {}; const tbStore = (r.tb && typeof r.tb === "object") ? r.tb : {};
    const per = {};
    COMPETITORS.forEach(c => {
      const a = Array.isArray(k[c.id]) ? k[c.id] : [];
      const shots = SPOTS.map((_, i) => [6, 1, 0].includes(a[i]) ? a[i] : null);
      const taken = shots.filter(v => v != null);
      per[c.id] = { shots, taken: taken.length, total: taken.length ? sum(taken) : null,
        goals: taken.filter(v => v === 6).length, behinds: taken.filter(v => v === 1).length };
    });
    const complete = COMPETITORS.every(c => per[c.id].taken === SPOTS.length);
    const groups = [];
    if (complete) {
      const byTotal = {};
      COMPETITORS.forEach(c => { (byTotal[per[c.id].total] = byTotal[per[c.id].total] || []).push(c.id); });
      Object.keys(byTotal).map(Number).sort((a, b) => b - a).forEach(t => { if (byTotal[t].length > 1) groups.push(byTotal[t]); });
    }
    const tb = {}; COMPETITORS.forEach(c => tb[c.id] = [0]);
    const unresolved = [], resolved = {};
    groups.forEach(g => {
      const order = tbStore[tieKey(g)];
      if (Array.isArray(order) && order.length === g.length && g.every(x => order.includes(x))) { order.forEach((cid, i) => { tb[cid] = [-i]; resolved[cid] = { i, n: g.length }; }); }
      else unresolved.push(g);
    });
    return { per, complete, groups, unresolved, resolved, tb, tbStore };
  }
  function eventStanding(ev) {
    if (ev.kicks) {
      const k = kickData();
      const started = COMPETITORS.some(c => k.per[c.id].taken > 0);
      const status = !started ? "upcoming" : (k.complete && !k.unresolved.length) ? "final" : "live";
      const vals = {}; COMPETITORS.forEach(c => vals[c.id] = k.per[c.id].total);
      return { status, rows: rankAndScore(vals, "high", ev.table, false, k.tb), k, mode: "kicks" };
    }
    if (ev.voted) {
      const d = coffeeData();
      const status = d.judges.length === 0 ? "upcoming" : (d.done && d.groups.every(x => x.order)) ? "final" : "live";
      const rows = rankAndScore(d.avg, "low", ev.table, d.done, d.tbMap);
      return { status, rows, d, mode: "rank" };
    }
    if (ev.card) {
      const g = golfData();
      const started = COMPETITORS.filter(c => g.per[c.id].thru > 0).length;
      const done = COMPETITORS.filter(c => g.per[c.id].thru === HOLES).length;
      const status = started === 0 ? "upcoming" : (done === COMPETITORS.length && !g.unresolved.length) ? "final" : "live";
      const vals = {};
      COMPETITORS.forEach(c => { const p = g.per[c.id]; vals[c.id] = p.thru === 0 ? null : (!g.complete && g.parAll ? p.toPar : p.total); });
      return { status, rows: rankAndScore(vals, "low", ev.table, false, g.tb), g, mode: "golf" };
    }
    const cfg = eventConfig(ev);
    const scores = (S.results[ev.id] && S.results[ev.id].scores) || {};
    const vals = {}; COMPETITORS.forEach(c => vals[c.id] = typeof scores[c.id] === "number" ? scores[c.id] : null);
    const n = COMPETITORS.filter(c => vals[c.id] != null).length;
    const status = n === 0 ? "upcoming" : n === COMPETITORS.length ? "final" : "live";
    return { status, rows: rankAndScore(vals, MODES[cfg.mode].better, ev.table, false), cfg, mode: cfg.mode };
  }
  function overall() {
    const per = {}; const tot = {}; COMPETITORS.forEach(c => { per[c.id] = {}; tot[c.id] = 0; });
    const st = {};
    EVENTS.forEach(ev => {
      const s = eventStanding(ev); st[ev.id] = s;
      if (s.status === "final") s.rows.forEach(r => { per[r.cid][ev.id] = r.pts; tot[r.cid] += r.pts || 0; });
    });
    const rows = rankAndScore(tot, "high", [1, 1, 1, 1, 1], true).map(r => ({ ...r, total: tot[r.cid], per: per[r.cid] }));
    rows.sort((a, b) => (b.total - a.total) || wins(b.cid, st) - wins(a.cid, st) || C[a.cid].name.localeCompare(C[b.cid].name));
    return { rows, st };
  }
  function wins(cid, st) { return EVENTS.filter(ev => st[ev.id].status === "final" && st[ev.id].rows.some(r => r.cid === cid && r.place === 1)).length; }

  // ---------- rendering ----------

  }

  function standingsTable(ev, s) {

  function tbLock(x, j) {
    if (!S.db) return "Connecting to the scoreboard…";
    const v = S.tbvotes[x.key + "~" + j];
    return "";
  }
  function renderTbBallot(d) {
    const box = $("#tbBallotBox"); if (!box) return;
    const pending = d.done ? d.groups.filter(x => !x.order) : [];
    if (!pending.length) { box.innerHTML = ""; return; }
    const j = S.ballot.judge && C[S.ballot.judge] ? S.ballot.judge : "";
    const html = pending.map(x => {
      const names = x.g.map(id => C[id].name).join(" & ");
      const head = `<p class="tbb-head"><b>Tie-break:</b> ${esc(names)} are level on ${x.avg.toFixed(2)}. ${x.voters.length ? `${x.voted.length} of ${x.voters.length} votes in.` : ""}</p>`;
      if (!x.voters.length) return `<div class="tbb">${head}<p class="muted small">Everyone is in this tie, so the organiser will decide it.</p></div>`;
      if (x.stillTied) return `<div class="tbb">${head}<p class="muted small">The re-vote is still level, so the organiser will decide it.</p></div>`;
      if (!j) return `<div class="tbb">${head}<p class="muted small">${S.organiser ? "Pick a name below to enter a tie-break vote for them." : "Only linked competitors vote in the tie-break."}</p></div>`;
      if (x.g.includes(j)) return `<div class="tbb">${head}<p class="muted small">You're in this tie, so you sit this vote out.</p></div>`;
      const stored = S.tbvotes[x.key + "~" + j];
      const dr = S.tbBallot[x.key + "~" + j] = S.tbBallot[x.key + "~" + j] || { order: [], dirty: false };
      if (!dr.dirty) dr.order = stored && Array.isArray(stored.ranking) ? stored.ranking.filter(id => x.g.includes(id)) : [];
      const lock = tbLock(x, j);
      const picks = x.g.map(id => { const i = dr.order.indexOf(id); return `<button type="button" class="pick" data-tbk="${x.key}" data-c="${id}" aria-pressed="${i >= 0}" ${lock ? "disabled" : ""}>${monoHTML(C[id])}<span class="nm">${esc(C[id].name)}</span><span class="pick-place">${i >= 0 ? ORD[i] : ""}</span></button>`; }).join("");
      const full = dr.order.length === x.g.length;
      const hint = lock ? lock : stored && !dr.dirty ? "Your tie-break vote is in. Tap to change it." : full ? "" : `Tap your favourite${x.g.length > 2 ? "s in order, best first" : ""}.`;
      return `<div class="tbb">${head}<p class="muted small">Rank just these lattes again, ${esc(C[j].name)}.</p>
        <div class="pool">${picks}</div>
        <div class="btns"><button class="btn primary" type="button" data-tbsubmit="${x.key}" ${lock || !full || !dr.dirty ? "disabled" : ""}>${stored ? "Update tie-break vote" : "Submit tie-break vote"}</button><span class="muted small">${esc(hint)}</span></div></div>`;
    }).join("");
    box.innerHTML = `<div class="tbbox">${html}</div>`;
    box.querySelectorAll(".pick[data-tbk]").forEach(b => b.addEventListener("click", () => {
      const key = b.dataset.tbk; const g = key.split("+"); const dr = S.tbBallot[key + "~" + j];
      const i = dr.order.indexOf(b.dataset.c);
      if (i >= 0) dr.order.splice(i, 1); else dr.order.push(b.dataset.c);
      if (dr.order.length === g.length - 1) dr.order.push(g.find(x => !dr.order.includes(x)));
      dr.dirty = true;
      renderTbBallot(eventStanding(E.coffee).d);
    }));
    box.querySelectorAll("[data-tbsubmit]").forEach(b => b.addEventListener("click", async () => {
      const key = b.dataset.tbsubmit; const dr = S.tbBallot[key + "~" + j]; b.disabled = true;
      try {
        await S.db.doc("tbvotes/" + key + "~" + j).set({ group: key, voter: j, ranking: dr.order.slice(), by: S.uid || null, at: new Date().toISOString() });
        dr.dirty = false; toast(`${C[j].name}'s tie-break vote is in`);
      } catch (e) { writeFailed(e); b.disabled = false; }
    }));
  }
  function ballotLock(d) {
    const j = S.ballot.judge; if (!j) return { locked: true, msg: "" };
    if (!S.db) return { locked: true, msg: "Connecting to the scoreboard…" };
    if (d.closed) return { locked: true, msg: "Voting is closed." };
    if (d.done && !S.organiser) return { locked: true, msg: "Main voting is complete." };
    const v = S.votes[j];
    return { locked: false, msg: "" };
  }
  function updateBallotControls(d) {
    const lock = ballotLock(d);
    const msg = $("#ballotMsg"); if (msg) msg.innerHTML = lock.msg ? `<div class="notice calm">${esc(lock.msg)}</div>` : "";
    document.querySelectorAll("#ballotRows .pick").forEach(b => b.disabled = lock.locked);
    const sub = $("#ballotSubmit"), reset = $("#ballotReset"), hint = $("#ballotHint");
    if (!sub) return;
    const missing = 4 - S.ballot.order.length;

    reset.disabled = lock.locked || S.ballot.order.length === 0;
    sub.textContent = existing ? "Update ranking" : "Submit ranking";
    if (hint) hint.textContent = lock.locked ? "" : missing ? `Rank ${missing} more to submit.` : !S.ballot.dirty && existing ? "Your ranking is in. Start over to change it." : "";
  }
  async function submitBallot() {
    const j = S.ballot.judge; if (!j || !S.db || S.ballot.order.length !== 4) return;
    const sub = $("#ballotSubmit"); sub.disabled = true;

      await S.db.doc("votes/" + j).set({ ranking: S.ballot.order.slice(), by: S.uid || null, at: new Date().toISOString() });

    return `<div><p class="eyebrow">Every judge's ranking</p><div class="tscroll"><table class="matrix"><thead><tr><th>Judge ↓ / Latte →</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>${tbLines}</div>`;

  function updateKickSums() {

  function setKickStatus(t) { const el = $("#kcStatus"); if (el) el.textContent = t; }
  function scheduleKickSave() { clearTimeout(S.kick.timer); setKickStatus("Unsaved changes…"); S.kick.timer = setTimeout(saveKicks, 600); }
  async function writeKickDoc(kicks, tb) {
    await S.db.doc("results/afl").set({ kicks, tb, at: new Date().toISOString() });
  }
  async function saveKicks() {
    const kd = S.kick; if (!kd || !S.db) return;
    if (kd.saving) { scheduleKickSave(); return; }
    const rev = kd.rev; kd.saving = true; setKickStatus("Saving…");
    try {
      await writeKickDoc(JSON.parse(JSON.stringify(kd.kicks)), kickData().tbStore);
      kd.saving = false;
      if (S.kick === kd && kd.rev === rev) { kd.dirty = false; setKickStatus("All kicks saved"); }
      if (S.view === "afl") refreshEvent(false);
    } catch (err) { kd.saving = false; setKickStatus("Couldn't save. Tap again to retry."); writeFailed(err); }
  }
  function renderTieBreak(s, edit) {
    const box = $("#tbBox"); if (!box) return;
    const k = s.k;
    if (!k.complete || !k.groups.length) { box.innerHTML = ""; return; }
    const parts = k.groups.map(g => {
      const key = tieKey(g); const stored = k.tbStore[key];
      const done = Array.isArray(stored) && stored.length === g.length && g.every(x => stored.includes(x));
      const names = g.map(id => C[id].name).join(" & ");
      const total = k.per[g[0]].total;
      if (done) {
        return `<div class="tb done"><div><b>Tie-break on ${total}:</b> ${stored.map((id, i) => `${ORD[i]} ${esc(C[id].name)}`).join(" · ")}</div>${edit ? `<button class="btn" type="button" data-tbreset="${key}">Redo</button>` : ""}</div>`;
      }

  // ----- mini golf scorecard -----
  function golfFromStore() {
    const g = S.results.golf || {};
    const cell = v => typeof v === "number" ? String(v) : "";
    const par = Array.from({ length: HOLES }, (_, h) => cell(Array.isArray(g.par) ? g.par[h] : null));
    const holes = {}; COMPETITORS.forEach(c => { const a = (g.holes && g.holes[c.id]) || []; holes[c.id] = Array.from({ length: HOLES }, (_, h) => cell(a[h])); });
    return { par, holes, dirty: false, rev: 0, saving: false, timer: null, status: "" };
  }
  const cellVal = s => { const t = String(s).trim(); if (!t) return null; if (!/^\d{1,2}$/.test(t)) return NaN; const n = Number(t); return n >= 1 && n <= 20 ? n : NaN; };
  function renderGolfTieBreak(edit) {
    const box = $("#golfTbBox"); if (!box) return;
    const g = golfData();
    if (!g.complete || !g.groups.length) { box.innerHTML = ""; return; }
    const parts = g.groups.map(gr => {
      const key = tieKey(gr); const stored = g.tbStore[key];
      const done = Array.isArray(stored) && stored.length === gr.length && gr.every(x => stored.includes(x));
      const names = gr.map(id => C[id].name).join(" & ");
      const total = g.per[gr[0]].total;
      if (done) return `<div class="tb done"><div><b>Putt-off on ${total}:</b> ${stored.map((id, i) => `${ORD[i]} ${esc(C[id].name)}`).join(" · ")}</div>${edit ? `<button class="btn" type="button" data-gtbreset="${key}">Redo</button>` : ""}</div>`;
      if (!edit) return `<div class="tb"><b>Putt-off needed on ${total}:</b> ${esc(names)}. Back in the office for this one.</div>`;
      const order = S.tbDraft["golf:" + key] || [];
      return `<div class="tb"><div><b>Putt-off on ${total}:</b> ${esc(names)}. Tap the putt-off winner${gr.length > 2 ? "s in order, best first" : ""}.</div>
        <div class="tbpicks">${gr.map(id => { const i = order.indexOf(id); return `<button type="button" class="tbpick" data-gtbkey="${key}" data-c="${id}" aria-pressed="${i >= 0}">${monoHTML(C[id])}<span>${esc(C[id].name)}</span>${i >= 0 ? `<b>${ORD[i]}</b>` : ""}</button>`; }).join("")}</div></div>`;
    });
    box.innerHTML = `<div class="tbwrap">${parts.join("")}</div>`;
    if (!edit) return;
    const save = async tb => {
      const cur = S.results.golf || {};
      await S.db.doc("results/golf").set({ ...cur, tb, at: new Date().toISOString() });
    };
    box.querySelectorAll(".tbpick").forEach(b => b.addEventListener("click", async () => {
      const key = b.dataset.gtbkey; const gr = key.split("|"); const dk = "golf:" + key;
      const order = (S.tbDraft[dk] = S.tbDraft[dk] || []);
      const i = order.indexOf(b.dataset.c); if (i >= 0) order.splice(i, 1); else order.push(b.dataset.c);
      if (order.length === gr.length - 1) order.push(gr.find(x => !order.includes(x)));
      if (order.length === gr.length) {
        try { await save({ ...golfData().tbStore, [key]: order.slice() }); delete S.tbDraft[dk]; toast("Putt-off result saved"); }
        catch (err) { writeFailed(err); order.length = 0; }
      }
      renderGolfTieBreak(true);
    }));
    box.querySelectorAll("[data-gtbreset]").forEach(b => b.addEventListener("click", async () => {
      const tb = { ...golfData().tbStore }; delete tb[b.dataset.gtbreset];
      try { await save(tb); toast("Putt-off result cleared"); } catch (err) { writeFailed(err); }
    }));
  }
  function renderGolfReadOnly(panel) {
    const g = S.results.golf || {};
    const par = Array.isArray(g.par) ? g.par : [];
    const num = v => typeof v === "number" ? v : null;
    const part = (arr, a, b) => { const xs = arr.slice(a, b).map(num).filter(v => v != null); return xs.length ? sum(xs) : ""; };
    const rowsFor = (start, isBack) => {
      const idx = Array.from({ length: 9 }, (_, i) => start + i);
      const head = `<tr><th class="nm" scope="col">Hole</th>${idx.map(h => `<th scope="col">${h + 1}</th>`).join("")}<th class="sumh">${isBack ? "In" : "Out"}</th>${isBack ? `<th class="sumh">Tot</th>` : ""}</tr>`;
      const parRow = `<tr class="par"><td class="nm">Par</td>${idx.map(h => `<td class="ro">${num(par[h]) ?? ""}</td>`).join("")}<td class="sum">${part(par, start, start + 9)}</td>${isBack ? `<td class="sum">${part(par, 0, 18)}</td>` : ""}</tr>`;
      const players = COMPETITORS.map(c => {
        const a = (g.holes && Array.isArray(g.holes[c.id])) ? g.holes[c.id] : [];
        const cells = idx.map(h => {
          const v = num(a[h]), pr = num(par[h]);
          const cls = v == null || pr == null ? "" : v < pr ? " under" : v > pr ? " over" : "";
          return `<td class="ro${cls}">${v == null ? "" : `<span>${v}</span>`}</td>`;
        }).join("");
        return `<tr><td class="nm">${whoHTML(c)}</td>${cells}<td class="sum">${part(a, start, start + 9)}</td>${isBack ? `<td class="sum">${part(a, 0, 18)}</td>` : ""}</tr>`;
      }).join("");
      return `<div class="sc-scroll"><table class="sc"><thead>${head}</thead><tbody>${parRow}${players}</tbody></table></div>`;
    };
    const hasPar = par.some(v => typeof v === "number");
    panel.innerHTML = `<p class="eyebrow">Scorecard</p>
      <div class="scorecard">
        <div class="sc-top"><span class="sc-title">Albert Park Open Scorecard</span><span class="sc-status">Live from the organiser</span></div>
        ${rowsFor(0, false)}
        ${rowsFor(9, true)}
        <div class="sc-foot"><span class="sc-status">${hasPar ? "Circled scores are under par; boxed scores are over par." : "Strokes per hole, updated as the organiser enters them."}</span></div>
        <div id="golfTbBox"></div>
      </div>`;
    renderGolfTieBreak(false);
  }
  function renderGolfCard(panel, full) {
    const editing = panel.contains(document.activeElement) && document.activeElement.tagName === "INPUT";
    const busy = !!(S.golf && (S.golf.dirty || S.golf.saving));
    if ((busy || editing) && panel.querySelector(".scorecard")) { updateGolfSums(); renderGolfTieBreak(true); return; }
    const keepStatus = S.golf ? S.golf.status : "";
    if (!busy) { S.golf = golfFromStore(); S.golf.status = keepStatus; }
    const rowsFor = (start, isBack) => {
      const idx = Array.from({ length: 9 }, (_, i) => start + i);
      const head = `<tr><th class="nm" scope="col">Hole</th>${idx.map(h => `<th scope="col">${h + 1}</th>`).join("")}<th class="sumh">${isBack ? "In" : "Out"}</th>${isBack ? `<th class="sumh">Tot</th>` : ""}</tr>`;
      const parRow = `<tr class="par"><td class="nm">Par</td>${idx.map(h => `<td><input data-k="par" data-h="${h}" value="${esc(S.golf.par[h])}" inputmode="numeric" maxlength="2" aria-label="Par hole ${h + 1}" autocomplete="off"></td>`).join("")}<td class="sum" data-sum="par-${isBack ? "in" : "out"}"></td>${isBack ? `<td class="sum" data-sum="par-tot"></td>` : ""}</tr>`;
      const players = COMPETITORS.map(c => `<tr><td class="nm">${whoHTML(c)}</td>${idx.map(h => `<td><input data-k="${c.id}" data-h="${h}" value="${esc(S.golf.holes[c.id][h])}" inputmode="numeric" maxlength="2" aria-label="${esc(c.name)} hole ${h + 1}" autocomplete="off"></td>`).join("")}<td class="sum" data-sum="${c.id}-${isBack ? "in" : "out"}"></td>${isBack ? `<td class="sum" data-sum="${c.id}-tot"></td>` : ""}</tr>`).join("");
      return `<div class="sc-scroll"><table class="sc"><thead>${head}</thead><tbody>${parRow}${players}</tbody></table></div>`;
    };
    panel.innerHTML = `<p class="eyebrow">Organiser · scorecard</p>
      <div class="scorecard">

        ${rowsFor(0, false)}
        ${rowsFor(9, true)}
        <div class="sc-foot">
          <span class="sc-status">Enter strokes per hole (1–20). Par is optional; fill all 18 to show scores to par.</span>

      </div>`;
    panel.querySelectorAll(".sc input").forEach(inp => {
      inp.addEventListener("input", () => {
        const k = inp.dataset.k, h = Number(inp.dataset.h);
        if (k === "par") S.golf.par[h] = inp.value; else S.golf.holes[k][h] = inp.value;
        inp.classList.toggle("bad", Number.isNaN(cellVal(inp.value)));
        S.golf.dirty = true; S.golf.rev++;
        updateGolfSums(); scheduleGolfSave();
      });
      inp.addEventListener("keydown", e => {
        if (e.key !== "Enter") return; e.preventDefault();
        const all = [...panel.querySelectorAll(".sc input")]; const i = all.indexOf(inp); if (all[i + 1]) all[i + 1].focus();
      });

    });

    clr.addEventListener("click", async () => {
      if (!clr.dataset.armed) { clr.dataset.armed = "1"; clr.textContent = "Confirm: clear card"; return; }
      clearTimeout(S.golf.timer);
      try { await S.db.doc("results/golf").delete(); S.golf.dirty = false; toast("Scorecard cleared"); S.golf = null; refreshEvent(true); }
      catch (err) { writeFailed(err); }
    });
    updateGolfSums();
    setGolfStatus(keepStatus);
    renderGolfTieBreak(true);
  }
  function updateGolfSums() {
    if (!S.golf) return;
    const nums = arr => arr.map(cellVal).map(v => Number.isNaN(v) ? null : v);
    const fill = (key, arr) => {
      const n = nums(arr);
      const part = (a, b) => { const xs = n.slice(a, b).filter(v => v != null); return xs.length ? sum(xs) : ""; };
      const set = (suffix, v) => { const el = document.querySelector(`[data-sum="${key}-${suffix}"]`); if (el) el.textContent = v; };
      set("out", part(0, 9)); set("in", part(9, 18)); set("tot", part(0, 18));
    };
    fill("par", S.golf.par);
    COMPETITORS.forEach(c => fill(c.id, S.golf.holes[c.id]));
  }
  function setGolfStatus(t) { if (S.golf) S.golf.status = t; const el = $("#scStatus"); if (el && t) el.textContent = t; }
  function scheduleGolfSave() {
    clearTimeout(S.golf.timer); setGolfStatus("Unsaved changes…");
    S.golf.timer = setTimeout(saveGolf, 900);
  }
  async function saveGolf() {
    const g = S.golf; if (!g || !S.db) return;
    if (g.saving) { scheduleGolfSave(); return; }
    const clean = arr => arr.map(cellVal).map(v => (v == null || Number.isNaN(v)) ? null : v);
    const holes = {}; COMPETITORS.forEach(c => holes[c.id] = clean(g.holes[c.id]));
    const rev = g.rev; g.saving = true; setGolfStatus("Saving…");
    try {
      await S.db.doc("results/golf").set({ holes, par: clean(g.par), tb: golfData().tbStore, at: new Date().toISOString() });
      g.saving = false;
      const hasBad = [g.par, ...COMPETITORS.map(c => g.holes[c.id])].some(a => a.some(v => Number.isNaN(cellVal(v))));
      if (S.golf === g && g.rev === rev) {
        if (hasBad) setGolfStatus("Saved, except the red cells. Strokes must be 1–20.");
        else { g.dirty = false; setGolfStatus("All scores saved"); }
      }
      if (S.view === "golf") refreshEvent(false);
    } catch (err) { g.saving = false; setGolfStatus("Couldn't save. Keep typing to retry."); writeFailed(err); }
  }

  let kartLine = null;
  function recolour(src, done) {
    const im = new Image();
    im.onload = () => {
      try {
        const cv = document.createElement("canvas"); cv.width = im.naturalWidth; cv.height = im.naturalHeight;
        const ctx = cv.getContext("2d"); ctx.drawImage(im, 0, 0);
        const px = ctx.getImageData(0, 0, cv.width, cv.height); const d = px.data;
        const ink = getComputedStyle(document.documentElement).getPropertyValue("--art").trim() || "#5fd39a";
        const r0 = parseInt(ink.slice(1, 3), 16), g0 = parseInt(ink.slice(3, 5), 16), b0 = parseInt(ink.slice(5, 7), 16);
        for (let i = 0; i < d.length; i += 4) {
          const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          const dark = lum > 232 ? 0 : (255 - lum) / 255;
          d[i] = r0; d[i + 1] = g0; d[i + 2] = b0; d[i + 3] = Math.round(255 * Math.pow(dark, 1.5));
        }
        ctx.putImageData(px, 0, 0); done(cv.toDataURL("image/png"));
      } catch (e) { done(src); }
    };
    im.src = src;
  }
  function setArt() {
    const el = $("#art"); el.innerHTML = ART[S.view] || "";
    const li = el.querySelector("img.lineimg");
    if (!li) return;
    if (kartLine) li.src = kartLine;
    else recolour(KART_SRC, url => { kartLine = url; const cur = $("#art img.lineimg"); if (cur) cur.src = url; });
  }

  function route() {
    const h = (location.hash || "").replace("#", "");
    S.view = h === "overall" || E[h] ? h : "overall";
    renderTabs(); setArt();
    if (S.view === "overall") renderOverall(); else renderEvent(S.view);
    renderAccounts(true);
  }
  function onData() {
    if (S.view === "overall") {
      const open = $("#rulesBox")?.open; renderOverall(); if (open) $("#rulesBox").open = true;
    } else refreshEvent(false);
    renderAccounts(false);
  }
  function computeMe() {
    const me = COMPETITORS.find(c => String(S.players[c.id] || "").toLowerCase() === S.email);
    S.meCid = me ? me.id : null;
  }
  function renderAccounts(force) {
    const wrap = $("#acctWrap"); if (!wrap) return;
    if (!(S.organiser && S.db && S.view === "overall")) { wrap.innerHTML = ""; S.acctDraft = null; return; }
    const editing = wrap.contains(document.activeElement) && document.activeElement.tagName === "INPUT";
    if (!force && wrap.firstChild && ((S.acctDraft && S.acctDraft.dirty) || editing)) return;
    if (!S.acctDraft || !S.acctDraft.dirty) S.acctDraft = { emails: Object.fromEntries(COMPETITORS.map(c => [c.id, String(S.players[c.id] || "")])), dirty: false };
    const dr = S.acctDraft;
    const linked = COMPETITORS.filter(c => S.players[c.id]).length;
    wrap.innerHTML = `<section class="panel"><p class="eyebrow">Organiser · competitor accounts</p>
      <form id="acctForm" class="formgrid" novalidate>
        <p class="muted small">Link each competitor to their @shrunk.ai Google email. Only that person can submit the competitor's Barista Battle ranking and tie-break votes. Emails are stored in the database, not in the site's public code.</p>
        ${COMPETITORS.map(c => `<div class="frow wide"><label for="em-${c.id}">${whoHTML(c)}</label><input id="em-${c.id}" type="email" inputmode="email" value="${esc(dr.emails[c.id])}" placeholder="name@shrunk.ai" autocomplete="off"></div>`).join("")}
        <div id="acctErr"></div>
        <div class="btns"><button class="btn primary" type="submit" id="acctSave">Save accounts</button><span class="muted small" id="acctHint">${dr.dirty ? "Unsaved changes" : `${linked} of 5 linked${S.meCid ? ` · you're ${esc(C[S.meCid].name)}` : ""}`}</span></div>
      </form></section>`;
    COMPETITORS.forEach(c => $("#em-" + c.id).addEventListener("input", e => { dr.emails[c.id] = e.target.value; dr.dirty = true; $("#acctHint").textContent = "Unsaved changes"; }));
    $("#acctForm").addEventListener("submit", async e => {
      e.preventDefault();
      const dom = "@" + ((window.SHRUNK_CONFIG || {}).allowedDomain || "shrunk.ai");
      const out = {}; const bad = []; const seen = {};
      COMPETITORS.forEach(c => {
        const v = String(dr.emails[c.id] || "").trim().toLowerCase();
        if (!v) return;
        if (!/^[^@\s]+@[^@\s]+$/.test(v) || !v.endsWith(dom)) bad.push(`${c.name} needs an email ending in ${dom}`);
        else if (seen[v]) bad.push(`${c.name} and ${seen[v]} have the same email`);
        else { seen[v] = c.name; out[c.id] = v; }
      });
      if (bad.length) { $("#acctErr").innerHTML = `<div class="notice">${esc(bad.join(". "))}.</div>`; return; }
      $("#acctErr").innerHTML = "";
      const btn = $("#acctSave"); btn.disabled = true;
      try { await S.db.doc("meta/players").set({ ...out, at: new Date().toISOString() }); dr.dirty = false; toast("Competitor accounts saved"); }
      catch (err) { writeFailed(err); }
      btn.disabled = false;
    });
  }

  // ---------- data ----------
  async function start() {
    route();
    window.addEventListener("hashchange", route);
    wireAuth();
    const CFG = window.SHRUNK_CONFIG || {};
    const fb = CFG.firebase || {};
    if (!window.firebase || !fb.apiKey || /^PASTE/.test(fb.apiKey)) { showGate("noconfig"); return; }
    let auth, fs;
    try { firebase.initializeApp(fb); auth = firebase.auth(); fs = firebase.firestore(); }
    catch (e) { showGate("badconfig"); return; }
    S.auth = auth; S.fs = fs;
    S.provider = new firebase.auth.GoogleAuthProvider();
    S.provider.setCustomParameters({ prompt: "select_account", hd: CFG.allowedDomain || "shrunk.ai" });
    auth.getRedirectResult().catch(e => gateError(e));
    auth.onAuthStateChanged(u => {
      stopListening();
      if (!u) { showGate("signin"); return; }
      const dom = "@" + (CFG.allowedDomain || "shrunk.ai");
      const email = String(u.email || "").toLowerCase();
      if (!email.endsWith(dom)) { showGate("domain", email); return; }
      S.uid = u.uid; S.email = email; S.canWrite = true;
      S.organiser = !!CFG.organiserUid && !/^PASTE/.test(CFG.organiserUid) && u.uid === CFG.organiserUid;
      showApp(u, CFG);
      S.db = fs; subscribe(fs);
      route();
    });
  }
  function stopListening() {
    S.unsubs.forEach(f => { try { f(); } catch (e) {} });
    Object.assign(S, { unsubs: [], db: null, results: {}, votes: {}, tbvotes: {}, players: {}, meCid: null, organiser: false,
      golf: null, kick: null, adminDraft: {}, acctDraft: null, tbBallot: {}, tbDraft: {}, coffeeTbDraft: {}, ballot: { judge: null, order: [], dirty: false } });
  }
  function showGate(kind, email) {
    $("#gate").hidden = false; $("#tabs").hidden = true; $("#main").hidden = true;
    $("#acctWrap").innerHTML = ""; $("#setupNote").innerHTML = ""; $("#orgBadge").hidden = true;
    $("#whoami").textContent = ""; $("#signOutBtn").hidden = true; $("#gateErr").innerHTML = "";
    const title = $("#gateTitle"), msg = $("#gateMsg");
    $("#gateSignIn").hidden = kind !== "signin";
    $("#gateSignOut").hidden = kind !== "domain";
    if (kind === "noconfig") { title.textContent = "Almost ready"; msg.textContent = "The database isn't connected yet. Fill in config.js using the steps in README.md."; setSync("err", "Not connected"); }
    else if (kind === "badconfig") { title.textContent = "Database settings look wrong"; msg.textContent = "Check the Firebase details in config.js."; setSync("err", "Not connected"); }
    else if (kind === "domain") { title.textContent = "Use your Shrunk account"; msg.textContent = `You're signed in as ${email}. The Shrunklympics is for @${(window.SHRUNK_CONFIG || {}).allowedDomain || "shrunk.ai"} accounts only.`; setSync("err", "Signed in with the wrong account"); }
    else { title.textContent = "Sign in to the Shrunklympics"; msg.textContent = "Use your Shrunk Google account to see the leaderboards and vote."; setSync("err", "Signed out"); }
  }
  function showApp(u, CFG) {
    $("#gate").hidden = true; $("#tabs").hidden = false; $("#main").hidden = false;
    $("#orgBadge").hidden = !S.organiser;
    $("#whoami").textContent = ` · Signed in as ${u.displayName || S.email}`;
    $("#signOutBtn").hidden = false;
    const note = $("#setupNote");
    if (!CFG.organiserUid || /^PASTE/.test(CFG.organiserUid)) {
      note.innerHTML = `<div class="setup"><b>Setup step: organiser ID</b><span>No organiser is set yet. If you're the organiser, send this ID to Claude (or paste it into config.js and firestore.rules):</span><code id="uidCode">${esc(u.uid)}</code><div class="btns"><button class="btn" type="button" id="copyUid">Copy ID</button></div></div>`;
      $("#copyUid").addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(u.uid); toast("ID copied"); }
        catch (e) { const r = document.createRange(); r.selectNodeContents($("#uidCode")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Select and copy the highlighted ID"); }
      });
    } else note.innerHTML = "";
  }
  function gateError(e) {
    const c = (e && e.code) || "";
    if (!c || c.includes("popup-closed") || c.includes("cancelled-popup")) return;
    const box = $("#gateErr"); if (!box) return;
    box.innerHTML = `<div class="notice">${c.includes("unauthorized-domain") ? "This web address isn't allowed to sign in yet. Add it under Firebase > Authentication > Settings > Authorized domains." : c.includes("network") ? "Couldn't reach Google. Check your connection and try again." : "Sign-in didn't work. Please try again."}</div>`;
  }
  async function signIn() {
    if (!S.auth) return;
    $("#gateErr").innerHTML = "";
    try { await S.auth.signInWithPopup(S.provider); }
    catch (e) {
      const c = (e && e.code) || "";
      if (c.includes("popup-blocked") || c.includes("operation-not-supported")) { try { await S.auth.signInWithRedirect(S.provider); } catch (e2) { gateError(e2); } }
      else gateError(e);
    }
  }
  function wireAuth() {
    $("#gateSignIn").addEventListener("click", signIn);
    $("#gateSignOut").addEventListener("click", () => S.auth && S.auth.signOut());
    $("#signOutBtn").addEventListener("click", async () => { if (S.auth) { await S.auth.signOut(); toast("Signed out"); } });
  }
  function subscribe(db) {
    let gotR = false, gotV = false;
    const timer = setTimeout(() => { if (!gotR || !gotV) setSync("err", "Can't reach the scoreboard yet"); }, 10000);
    const settle = () => { if (gotR && gotV) { clearTimeout(timer); setSync("on", "Live"); } };
    const stopped = () => { clearTimeout(timer); setSync("err", "Live updates stopped. Reload to reconnect."); };
    S.unsubs.push(() => clearTimeout(timer));
    S.unsubs.push(db.collection("results").onSnapshot(snap => {
      const r = {}; snap.docs.forEach(d => { if (d.exists) r[d.id] = d.data(); }); S.results = r;
      if (!snap.metadata.fromCache) { gotR = true; settle(); }
      onData();
    }, stopped));
    S.unsubs.push(db.collection("votes").onSnapshot(snap => {
      const v = {}; snap.docs.forEach(d => { if (d.exists) v[d.id] = d.data(); }); S.votes = v;
      if (!snap.metadata.fromCache) { gotV = true; settle(); }
      onData();
    }, stopped));
    S.unsubs.push(db.collection("tbvotes").onSnapshot(snap => {
      const v = {}; snap.docs.forEach(d => { if (d.exists) v[d.id] = d.data(); }); S.tbvotes = v;
      onData();
    }, stopped));
    S.unsubs.push(db.doc("meta/players").onSnapshot(d => {
      S.players = d.exists ? (d.data() || {}) : {};
      computeMe(); onData();
    }, stopped));
    onData();
  }

  // ---------- night sky ----------
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function sky() {
    const cv = $("#sky"); const ctx = cv.getContext("2d"); if (!ctx) return;
    let stars = [], w = 0, h = 0;
    function size() {
      const dpr = Math.min(2, window.devicePixelRatio || 1); w = innerWidth; h = innerHeight;
      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(w * h / 9000);
      stars = Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + .3, p: Math.random() * Math.PI * 2, s: .4 + Math.random() * 1.2, g: Math.random() < .08 }));
    }
    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      for (const st of stars) {
        const a = reduce ? .5 : .25 + .45 * (0.5 + 0.5 * Math.sin(st.p + t / 1000 * st.s));
        ctx.fillStyle = st.g ? `rgba(232,184,75,${a})` : `rgba(200,220,235,${a})`;
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
      }
      if (!reduce) requestAnimationFrame(draw);
    }
    size(); addEventListener("resize", () => { size(); if (reduce) draw(0); });
    requestAnimationFrame(draw);
  }

  // ---------- rotating rings ----------
  function rings() {
    const cv = $("#rings");
    if (!window.THREE) { cv.hidden = true; return; }
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true }); }
    catch (e) { cv.hidden = true; return; }
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 100); cam.position.set(0, 0, 11);
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(3, 4, 6); scene.add(key);
    const glow = new THREE.PointLight(0x2fbf71, 1.4, 30); glow.position.set(-5, -3, 4); scene.add(glow);
    const warm = new THREE.PointLight(0xe8b84b, 0.9, 30); warm.position.set(5, 2, 3); scene.add(warm);
    const group = new THREE.Group();
    const gap = 2.35;
    const spec = [[-gap, .55, 0x0a85d8, .07], [0, .55, 0x8f9aa6, .07], [gap, .55, 0xee334e, .07], [-gap / 2, -.6, 0xfcb131, -.07], [gap / 2, -.6, 0x00a651, -.07]];
    const geo = new THREE.TorusGeometry(1, 0.13, 28, 140);
    spec.forEach(([x, y, c, tilt]) => {
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: c, metalness: .6, roughness: .28, emissive: c, emissiveIntensity: .15 }));
      m.position.set(x, y, 0); m.rotation.y = tilt * 3; m.rotation.x = tilt;
      group.add(m);
    });
    scene.add(group);
    function resize() {
      const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
      renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
    }
    resize(); addEventListener("resize", resize);
    function frame(t) {
      group.rotation.y = reduce ? -.35 : t * 0.00035;
      group.rotation.x = .12 + (reduce ? 0 : Math.sin(t * 0.0005) * .06);
      group.position.y = reduce ? 0 : Math.sin(t * 0.0008) * .12;
      renderer.render(scene, cam);
      if (!reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  sky();
  rings();
  start();
})();
</script>
</body>
</html>
